<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BubbleStream | Laundry Order Manager</title>
    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Link to premium vanilla CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22a7 7 0 0 0 5-2.1c2-2 3-5.2 1.8-7.9l-5.8-10.7a1 1 0 0 0-1.8 0L5.4 12c-1.2 2.7-.2 5.9 1.8 7.9a7 7 0 0 0 4.8 2.1z"/>
                    </svg>
                </div>
                <div>
                    <h1>BubbleStream</h1>
                    <p class="tagline">Laundry Order Management System</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="refreshStatsBtn" class="btn btn-secondary flex-center" onclick="loadDashboard(); loadOrders();">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin-hover">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                    </svg>
                    <span>Sync Dashboard</span>
                </button>
            </div>
        </header>

        <!-- Dashboard Statistics Section -->
        <section id="dashboard" class="dashboard-section">
            <div class="section-header">
                <h2>Operational Dashboard</h2>
                <span class="pulse-indicator"></span>
            </div>
            
            <div class="metrics-grid">
                <!-- Stat Card: Total Orders -->
                <div class="metric-card card-gradient-blue">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    </div>
                    <div class="metric-info">
                        <div id="statTotalOrders" class="metric-value">0</div>
                        <div class="metric-label">Total Orders</div>
                    </div>
                </div>

                <!-- Stat Card: Revenue -->
                <div class="metric-card card-gradient-green">
                    <div class="card-icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    </div>
                    <div class="metric-info">
                        <div id="statRevenue" class="metric-value">₹0</div>
                        <div class="metric-label">Total Revenue</div>
                    </div>
                </div>

                <!-- Stat Card: Received -->
                <div class="metric-card card-status" data-status="RECEIVED">
                    <div class="status-indicator status-RECEIVED"></div>
                    <div class="metric-info">
                        <div id="statReceived" class="metric-value">0</div>
                        <div class="metric-label">Received</div>
                    </div>
                </div>

                <!-- Stat Card: Processing -->
                <div class="metric-card card-status" data-status="PROCESSING">
                    <div class="status-indicator status-PROCESSING"></div>
                    <div class="metric-info">
                        <div id="statProcessing" class="metric-value">0</div>
                        <div class="metric-label">Processing</div>
                    </div>
                </div>

                <!-- Stat Card: Ready -->
                <div class="metric-card card-status" data-status="READY">
                    <div class="status-indicator status-READY"></div>
                    <div class="metric-info">
                        <div id="statReady" class="metric-value">0</div>
                        <div class="metric-label">Ready</div>
                    </div>
                </div>

                <!-- Stat Card: Delivered -->
                <div class="metric-card card-status" data-status="DELIVERED">
                    <div class="status-indicator status-DELIVERED"></div>
                    <div class="metric-info">
                        <div id="statDelivered" class="metric-value">0</div>
                        <div class="metric-label">Delivered</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Main Layout: Sidebar (Forms) & Main Area (Order Management List) -->
        <main class="main-layout">
            
            <!-- Left Side: Forms Column -->
            <aside class="forms-column">
                
                <!-- Create Order Section -->
                <div class="glass-panel">
                    <div class="panel-header">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="panel-icon icon-blue">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        <h2>Create Order</h2>
                    </div>
                    
                    <form id="orderForm" class="interactive-form">
                        <div class="form-group">
                            <label for="customerName">Customer Name</label>
                            <input type="text" id="customerName" placeholder="Enter name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" placeholder="Enter 10-digit number" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="address">Address</label>
                            <input type="text" id="address" placeholder="Enter delivery address" required>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group flex-2">
                                <label for="itemType">Garment Type</label>
                                <select id="itemType">
                                    <option value="Shirt">Shirt (₹20)</option>
                                    <option value="Pants">Pants (₹30)</option>
                                    <option value="Saree">Saree (₹50)</option>
                                </select>
                            </div>
                            <div class="form-group flex-1">
                                <label for="quantity">Quantity</label>
                                <input type="number" id="quantity" value="1" min="1" required>
                            </div>
                        </div>

                        <!-- Live Cost Estimator (Premium UX Enhancement) -->
                        <div class="cost-estimator">
                            <span>Estimated Total:</span>
                            <strong id="estimatedCost">₹20</strong>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Place Order
                        </button>
                    </form>
                    
                    <div id="orderResponse" class="notification-box"></div>
                </div>

                <!-- Update Status Section -->
                <div class="glass-panel">
                    <div class="panel-header">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="panel-icon icon-orange">
                            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
                        </svg>
                        <h2>Update Order Status</h2>
                    </div>
                    
                    <form id="statusForm" class="interactive-form">
                        <div class="form-row">
                            <div class="form-group flex-1">
                                <label for="updateOrderId">Order ID</label>
                                <input type="number" id="updateOrderId" placeholder="e.g. 1" min="1" required>
                            </div>
                            <div class="form-group flex-2">
                                <label for="updateStatus">New Status</label>
                                <select id="updateStatus">
                                    <option value="RECEIVED">RECEIVED</option>
                                    <option value="PROCESSING">PROCESSING</option>
                                    <option value="READY">READY</option>
                                    <option value="DELIVERED">DELIVERED</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-secondary w-100">
                            Update Status
                        </button>
                    </form>
                </div>
            </aside>

            <!-- Right Side: Orders Management and View Column -->
            <section class="orders-column glass-panel">
                <div class="panel-header flex-between">
                    <div class="title-with-count">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="panel-icon icon-green">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                        </svg>
                        <h2>Laundry Orders</h2>
                    </div>
                    <span id="ordersCountBadge" class="badge">0 Orders</span>
                </div>

                <!-- Filters Box -->
                <div class="filters-container">
                    <div class="filter-group">
                        <label for="filterStatus">Status</label>
                        <select id="filterStatus" onchange="loadOrders()">
                            <option value="">All Statuses</option>
                            <option value="RECEIVED">RECEIVED</option>
                            <option value="PROCESSING">PROCESSING</option>
                            <option value="READY">READY</option>
                            <option value="DELIVERED">DELIVERED</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label for="filterName">Customer Name</label>
                        <input type="text" id="filterName" placeholder="Search by name..." oninput="loadOrders()">
                    </div>

                    <div class="filter-group">
                        <label for="filterPhone">Phone Number</label>
                        <input type="text" id="filterPhone" placeholder="Search by phone..." oninput="loadOrders()">
                    </div>
                </div>

                <!-- Active Orders list -->
                <div class="orders-list-wrapper">
                    <div id="ordersContainer" class="orders-list">
                        <!-- Filled dynamically by JavaScript -->
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                            </svg>
                            <p>Loading laundry records...</p>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Script connection -->
    <script src="script.js"></script>
</body>
</html>
